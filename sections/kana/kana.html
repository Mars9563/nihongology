<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kana - Nihongology</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="kana.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg">
        <div class="container">
            <a class="navbar-brand" href="/">Nihongology</a>
        </div>
    </nav>
    
    <div class="container mt-4">
        <div class="row">
            <!-- Sidebar -->
            <aside class="col-md-3 sidebar">
                <div class="list-group">
                    <a href="/kana" class="list-group-item list-group-item-action active">Kana Charts</a>
                    <a href="#" class="list-group-item list-group-item-action">Interactive Quiz</a>
                    <a href="#" class="list-group-item list-group-item-action">Practice Exercises</a>
                </div>
            </aside>
            
            <!-- Main Content -->
            <main class="col-md-9">
                <ul class="nav nav-tabs" id="kanaTabs">
                    <li class="nav-item">
                        <a class="nav-link active" id="hiragana-tab" data-bs-toggle="tab" href="#hiragana">Hiragana</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" id="katakana-tab" data-bs-toggle="tab" href="#katakana">Katakana</a>
                    </li>
                </ul>
                
                <div class="tab-content mt-3">
                    <div class="tab-pane fade show active" id="hiragana">
                        <div class="kana-chart" id="hiraganaChart"></div>
                    </div>
                    <div class="tab-pane fade" id="katakana">
                        <div class="kana-chart" id="katakanaChart"></div>
                    </div>
                </div>
            </main>
        </div>
    </div>
    <!-- jQuery (Must be loaded before kana.js) -->
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Your Kana Script -->
    <script src="kana.js"></script>

</body>
</html>
