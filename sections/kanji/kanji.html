<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kanji - Nihongology</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="kanji.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg">
        <div class="container">
            <a class="navbar-brand" href="/">Nihongology</a>
        </div>
    </nav>
    
    <div class="container mt-4">
        <div class="row">
            <!-- Sidebar -->
            <aside class="col-md-3 sidebar">
                <div class="list-group">
                    <a href="#" class="list-group-item list-group-item-action active" data-section="kanji-section">JLPT Level Selection</a>
                    <a href="#" class="list-group-item list-group-item-action" data-section="quiz-section">Quiz</a>
                </div>
            </aside>
            
            <!-- Main Content -->
            <main class="col-md-9">
                <section id="kanji-section">
                    <h2>Select JLPT Level</h2>
                    <div class="btn-group" role="group">
                        <button class="btn btn-primary jlpt-btn" data-target="#n5Kanji">JLPT N5</button>
                        <button class="btn btn-primary jlpt-btn" data-target="#n4Kanji">JLPT N4</button>
                        <button class="btn btn-primary jlpt-btn" data-target="#n3Kanji">JLPT N3</button>
                        <button class="btn btn-primary jlpt-btn" data-target="#n2Kanji">JLPT N2</button>
                        <button class="btn btn-primary jlpt-btn" data-target="#n1Kanji">JLPT N1</button>
                    </div>

                    <div class="kanji-content mt-3">
                        <div class="kanji-list" id="n5Kanji"></div>
                        <div class="kanji-list d-none" id="n4Kanji"></div>
                        <div class="kanji-list d-none" id="n3Kanji"></div>
                        <div class="kanji-list d-none" id="n2Kanji"></div>
                        <div class="kanji-list d-none" id="n1Kanji"></div>
                    </div>
                </section>

                <section id="quiz-section" class="d-none">
                    <h2>Kanji Quiz</h2>
                    <p>Start testing your Kanji knowledge!</p>
                    <button class="btn btn-success" id="start-quiz">Start Quiz</button>
                    <div id="quiz-container" class="mt-3"></div>
                </section>
            </main>
        </div>
    </div>

    <!-- Footer -->
    <footer class="footer">
        <div class="container text-center">
            <p>&copy; 2025 Nihongology. All Rights Reserved.</p>
        </div>
    </footer>

    <!-- jQuery -->
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        $(document).ready(function() {
            $(".list-group-item").click(function() {
                $(".list-group-item").removeClass("active");
                $(this).addClass("active");
                let section = $(this).data("section");
                $("section").addClass("d-none");
                $("#" + section).removeClass("d-none");
            });

            $(".jlpt-btn").click(function() {
                $(".kanji-list").addClass("d-none");
                let target = $(this).data("target");
                $(target).removeClass("d-none");
            });
        });
    </script>
</body>
</html>
